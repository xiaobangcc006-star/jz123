<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <link rel="icon" href="data:,">
  <title>急救小组查检表</title>
  <style>
    :root {
      --sky: #d9f2fc;
      --sky-dark: #b9e5f5;
      --sky-pale: #f0faff;
      --ink: #23465f;
      --muted: #718b9d;
      --line: #d5eaf3;
      --panel: #ffffff;
      --bg: #f7fcff;
      --ok: #1b9a69;
      --bad: #d85353;
      --shadow: 0 8px 22px rgba(45, 109, 141, .12);
    }

    * { box-sizing: border-box; }
    html { min-width: 0; background: var(--bg); }
    body {
      margin: 0;
      min-width: 0;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
      font-size: 16px;
      line-height: 1.55;
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
    }

    button, input, textarea, select { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    input, textarea, select { font-size: 16px; }
    .app-shell { min-height: 100vh; padding-bottom: calc(72px + env(safe-area-inset-bottom)); }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: max(7px, env(safe-area-inset-top)) 10px 8px;
      background: linear-gradient(135deg, #eefaff, #d9f2fc);
      box-shadow: 0 2px 12px rgba(25, 103, 143, .16);
    }
    .topbar-inner { max-width: 760px; margin: 0 auto; text-align: center; }
    h1 { margin: 0; color: #2c5870; font-size: clamp(18px, 5vw, 25px); line-height: 1.2; text-align: center; overflow-wrap: anywhere; }
    .topbar-select { max-width: 560px; margin: 5px auto 0; }
    .topbar-select select { width: 100%; min-height: 36px; padding: 5px 30px 5px 9px; color: var(--ink); background: rgba(255,255,255,.82); border: 1px solid #b9deeb; border-radius: 9px; outline: none; }
    .mobile-hint { max-width: 560px; margin: 4px auto 0; color: #547b8d; font-size: 11px; line-height: 1.35; text-align: left; }

    main { max-width: 760px; margin: 0 auto; padding: 8px 10px 0; }
    .section-card {
      margin-bottom: 8px;
      padding: 10px;
      background: var(--panel);
      border: 1px solid #d9eaf3;
      border-radius: 16px;
      box-shadow: var(--shadow);
    }
    .section-title { margin: 0 0 7px; font-size: 17px; line-height: 1.3; }
    .section-note { margin: -3px 0 8px; color: var(--muted); font-size: 12px; }

    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
    .field { min-width: 0; }
    .field label { display: block; margin: 0 0 3px; color: var(--muted); font-size: 12px; font-weight: 700; }
    .field input, .field textarea, .field select {
      width: 100%;
      min-height: 39px;
      padding: 6px 8px;
      color: var(--ink);
      background: #fbfdff;
      border: 1px solid var(--line);
      border-radius: 10px;
      outline: none;
    }
    .field textarea { min-height: 76px; resize: vertical; }
    .field input:focus, .field textarea:focus, .field select:focus { border-color: #91cfe4; box-shadow: 0 0 0 3px rgba(145, 207, 228, .18); }
    .required { color: var(--bad); }

    .items-list { display: grid; gap: 7px; }
    .item-card { padding: 9px; background: #fcfeff; border: 1px solid #dceef5; border-radius: 11px; }
    .item-head { display: flex; align-items: flex-start; gap: 7px; }
    .item-no { flex: 0 0 27px; display: grid; place-items: center; min-height: 27px; padding: 1px 4px; color: #125c85; background: #dff4ff; border-radius: 8px; font-weight: 800; }
    .item-name { min-width: 0; flex: 1; margin: 1px 0 0; font-size: 15px; font-weight: 800; line-height: 1.3; overflow-wrap: anywhere; }
    .item-standard { margin: 6px 0 2px; color: var(--ink); font-size: 13px; line-height: 1.4; overflow-wrap: anywhere; }
    .item-method { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.35; overflow-wrap: anywhere; }
    .items-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: -2px 0 8px; }
    .status-badge, .progress-badge { display: inline-flex; align-items: center; min-height: 30px; padding: 4px 9px; border-radius: 999px; font-size: 12px; font-weight: 800; }
    .status-badge { color: #28657f; background: #e6f7fd; border: 1px solid #c6e9f4; }
    .status-badge[data-status="填写中"] { color: #88632c; background: #fff6df; border-color: #f0ddb0; }
    .status-badge[data-status="已完成"], .status-badge[data-status="已导出"] { color: #237354; background: #e7f8ef; border-color: #bce8ce; }
    .progress-badge { color: #6d8898; background: #f5fbfe; border: 1px solid #dceef5; }
    .toolbar-spacer { flex: 1 1 auto; }
    .small-action, .filter-toggle { min-height: 36px; padding: 7px 10px; color: #285b73; background: #effaff; border: 1px solid #c5e6f1; border-radius: 9px; font-size: 12px; font-weight: 700; cursor: pointer; }
    .filter-toggle { display: inline-flex; align-items: center; gap: 5px; }
    .filter-toggle input { width: 16px; height: 16px; margin: 0; accent-color: #82cbe2; }
    .item-card.is-highlighted { border-color: #86cfe7; box-shadow: 0 0 0 3px rgba(134, 207, 231, .26); animation: itemPulse 1.2s ease-out; }
    .empty-filter { padding: 16px 12px; color: var(--muted); background: #f8fdff; border: 1px dashed #c8e4ee; border-radius: 12px; text-align: center; }
    @keyframes itemPulse { 0% { background: #e8f9ff; } 100% { background: #fcfeff; } }
    .response-row { display: grid; grid-template-columns: minmax(124px, .9fr) minmax(0, 1.1fr); gap: 6px; align-items: center; margin-top: 7px; }
    .choice-group { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
    .choice { position: relative; min-width: 0; }
    .choice input { position: absolute; opacity: 0; pointer-events: none; }
    .choice span { display: block; min-height: 40px; padding: 7px 3px; text-align: center; background: #fff; border: 1px solid var(--line); border-radius: 9px; font-size: 14px; font-weight: 700; }
    .choice input:checked + span { color: #fff; border-color: transparent; }
    .choice input[value="合格"]:checked + span { background: var(--ok); }
    .choice input[value="不合格"]:checked + span { background: var(--bad); }
    .choice input:focus-visible + span { outline: 3px solid rgba(22, 121, 180, .3); }
    .remark-input { width: 100%; min-height: 40px; padding: 7px 8px; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 9px; outline: none; }
    .remark-input:focus { border-color: #91cfe4; box-shadow: 0 0 0 3px rgba(145, 207, 228, .18); }

    .summary-box { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 11px 12px; color: #1c5876; background: var(--sky-pale); border: 1px solid #c7eaf9; border-radius: 12px; }
    .summary-box strong { color: #2d7895; font-size: 20px; }
    .formula { margin: 9px 0 0; color: var(--muted); font-size: 13px; }
    .hint { margin: 10px 0 0; color: var(--muted); font-size: 13px; }
    .error-list { margin: 9px 0 0; padding-left: 20px; color: var(--bad); font-size: 13px; }

    .bottom-actions { position: fixed; right: 0; bottom: 0; left: 0; z-index: 20; padding: 5px 8px max(5px, env(safe-area-inset-bottom)); background: rgba(255, 255, 255, .96); border-top: 1px solid #cfe3ee; box-shadow: 0 -4px 14px rgba(37, 102, 132, .12); backdrop-filter: blur(10px); }
    .actions-inner { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; max-width: 760px; margin: 0 auto; }
    .action-btn { min-width: 0; min-height: 40px; padding: 6px 2px; color: #285b73; background: var(--sky); border: 1px solid #a9ddeb; border-radius: 8px; font-size: 12px; font-weight: 800; cursor: pointer; }
    .action-btn:active { transform: translateY(1px); filter: brightness(.96); }
    .action-btn.primary { color: #285b73; background: #c7ebf7; border-color: #9fd7e9; }
    .action-btn.danger { color: #8e2929; background: #ffe9e9; border-color: #f2bdbd; }

    .toast { position: fixed; left: 50%; bottom: calc(94px + env(safe-area-inset-bottom)); z-index: 40; max-width: calc(100vw - 36px); padding: 9px 14px; color: #fff; background: rgba(20, 43, 61, .92); border-radius: 999px; opacity: 0; transform: translate(-50%, 10px); pointer-events: none; transition: .2s ease; font-size: 13px; text-align: center; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    .modal-backdrop { position: fixed; inset: 0; z-index: 30; display: none; padding: 18px 10px; background: rgba(16, 43, 62, .55); overflow: auto; }
    .modal-backdrop.open { display: flex; align-items: flex-start; justify-content: center; }
    .modal { width: min(100%, 820px); margin: auto; background: #fff; border-radius: 14px; box-shadow: 0 18px 50px rgba(0,0,0,.25); overflow: hidden; }
    .modal-head { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 12px 14px; background: #e6f7ff; border-bottom: 1px solid #c8e9f6; }
    .modal-head h2 { margin: 0; font-size: 18px; }
    .close-btn { width: 38px; height: 38px; color: #155576; background: transparent; border: 0; border-radius: 8px; font-size: 26px; line-height: 1; cursor: pointer; }
    .preview-wrap { padding: 12px; background: #e8eef2; }
    .preview-sheet { width: 100%; min-height: 260px; padding: 18px 15px 22px; color: #111; background: #fff; box-shadow: 0 3px 12px rgba(0,0,0,.1); }
    .preview-title { margin: 0 0 14px; text-align: center; font-family: SimSun, "Songti SC", serif; font-size: 20px; font-weight: 700; }
    .preview-table { width: 100%; border-collapse: collapse; table-layout: fixed; font-family: SimSun, "Songti SC", serif; font-size: 12px; }
    .preview-table th, .preview-table td { padding: 6px 4px; border: 1px solid #222; vertical-align: middle; overflow-wrap: anywhere; }
    .preview-table th { text-align: center; font-weight: 700; background: #fafafa; }
    .preview-table td.center { text-align: center; }
    .preview-table col.no { width: 6%; }
    .preview-table col.item { width: 16%; }
    .preview-table col.standard { width: 35%; }
    .preview-table col.method { width: 16%; }
    .preview-table col.result { width: 7%; }
    .preview-table col.remark { width: 13%; }
    .preview-meta { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 16px; font-family: SimSun, "Songti SC", serif; font-size: 12px; text-align: center; }
    .preview-meta span { min-width: 0; overflow-wrap: anywhere; word-break: break-word; }
    .preview-rate { margin-top: 10px; font-family: SimSun, "Songti SC", serif; font-size: 12px; }
    .preview-version { margin-top: 7px; color: #666; font-family: SimSun, "Songti SC", serif; font-size: 10px; text-align: right; }
    .modal-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; padding: 8px 10px; border-top: 1px solid #e0e9ee; }
    .modal-actions .action-btn { flex: 1 1 120px; min-width: 105px; }

    @media (max-width: 520px) {
      .form-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .response-row { grid-template-columns: minmax(118px, .9fr) minmax(0, 1.1fr); }
      .actions-inner { grid-template-columns: repeat(5, minmax(0, 1fr)); }
      .action-btn { font-size: 11px; }
      .preview-sheet { padding: 12px 7px 16px; }
      .preview-table { font-size: 9px; }
      .preview-table th, .preview-table td { padding: 4px 2px; }
      .preview-meta, .preview-rate { font-size: 9px; }
      .preview-version { font-size: 8px; }
      .toolbar-spacer { display: none; }
    }

    @media print {
      @page { size: A4 portrait; margin: 12mm; }
      body { background: #fff; }
      .app-shell, .modal-head, .modal-actions, .bottom-actions, .toast { display: none !important; }
      .modal-backdrop { position: static; display: block; padding: 0; background: #fff; overflow: visible; }
      .modal { width: 100%; margin: 0; box-shadow: none; border-radius: 0; overflow: visible; }
      .preview-wrap { padding: 0; background: #fff; }
      .preview-sheet { min-height: auto; padding: 0; box-shadow: none; }
      .preview-table { font-size: 10pt; }
      .preview-table th, .preview-table td { padding: 5pt 4pt; }
      .preview-meta, .preview-rate { font-size: 10pt; }
      .preview-version { font-size: 8pt; }
      .preview-table thead { display: table-header-group; }
      .preview-table tr { break-inside: avoid; page-break-inside: avoid; }
      .preview-table { page-break-inside: auto; }
      .preview-table th, .preview-table td { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      @supports (content: counter(page)) {
        @page { @bottom-right { content: "第 " counter(page) " 页 / 共 " counter(pages) " 页"; font-size: 9pt; color: #555; } }
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-inner">
        <h1 id="pageTitle">查检表</h1>
        <div class="topbar-select">
          <select id="formSelect" aria-label="选择查检表"></select>
        </div>
        <p class="mobile-hint" id="mobileHint" hidden>提示：安卓设备请复制本页链接到系统浏览器中填写；微信内置浏览器不支持直接导出和分享 PDF、Word 文档。</p>
      </div>
    </header>

    <main>
      <section class="section-card">
        <h2 class="section-title">基本信息</h2>
        <div class="form-grid">
          <div class="field"><label for="inspector">查检人</label><input id="inspector" type="text" autocomplete="name" placeholder="请输入姓名"></div>
          <div class="field"><label for="checkDate">查检日期</label><input id="checkDate" type="date"></div>
          <div class="field"><label for="reviewer">护士长复核</label><input id="reviewer" type="text" placeholder="请输入姓名"></div>
        </div>
      </section>

      <section class="section-card">
        <h2 class="section-title" id="itemsTitle">检查项目</h2>
        <p class="section-note">请逐项选择结果；备注可填写发现的问题、整改要求或其他说明。</p>
        <div class="items-toolbar">
          <span class="status-badge" id="statusBadge" data-status="未开始">未开始</span>
          <span class="progress-badge" id="progressBadge">已填写 0 / 0</span>
          <span class="toolbar-spacer"></span>
          <button class="small-action" id="jumpBtn" type="button">跳转到未完成</button>
          <label class="filter-toggle"><input id="unfinishedOnly" type="checkbox">仅显示未完成</label>
        </div>
        <div class="items-list" id="itemsList"></div>
      </section>

      <section class="section-card">
        <h2 class="section-title">查检结果</h2>
        <div class="summary-box" id="summaryBox"></div>
        <p class="formula">合格率=合格项目数/总检查项目数×100%</p>
        <p class="hint">导出前会检查每个项目是否选择“合格”或“不合格”。</p>
        <ul class="error-list" id="errorList" hidden></ul>
      </section>
    </main>

    <nav class="bottom-actions" aria-label="操作栏">
      <div class="actions-inner">
        <button class="action-btn" id="saveBtn" type="button">保存</button>
        <button class="action-btn primary" id="previewBtn" type="button">预览</button>
        <button class="action-btn" id="pdfBtn" type="button">导出 PDF</button>
        <button class="action-btn" id="wordBtn" type="button">导出 Word</button>
        <button class="action-btn danger" id="clearBtn" type="button">清空</button>
      </div>
    </nav>
  </div>

  <div class="modal-backdrop" id="previewModal" role="dialog" aria-modal="true" aria-labelledby="previewHeading">
    <div class="modal">
      <div class="modal-head">
        <h2 id="previewHeading">导出前预览</h2>
        <button class="close-btn" id="closePreviewBtn" type="button" aria-label="关闭预览">×</button>
      </div>
      <div class="preview-wrap"><div class="preview-sheet" id="previewSheet"></div></div>
      <div class="modal-actions">
        <button class="action-btn" id="backEditBtn" type="button">返回修改</button>
        <button class="action-btn" id="previewPdfBtn" type="button">导出 PDF</button>
        <button class="action-btn" id="sharePdfBtn" type="button">分享 PDF</button>
        <button class="action-btn primary" id="previewWordBtn" type="button">下载 Word</button>
        <button class="action-btn" id="shareWordBtn" type="button">分享 Word</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      'use strict';

      const STORAGE_KEY = 'emergency-checklist-v1';
      function getLocalDate() {
        const date = new Date();
        const pad = value => String(value).padStart(2, '0');
        return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
      }
      const today = getLocalDate();
      const forms = [
        {
          id: 'prehospital', title: '院前急救小组查检表', items: [
            ['预警信息接收', '在岗期间预警信息即时响应，无漏接', '查阅记录'],
            ['预警信息记录', '准确记录于登记本或系统，内容完整', '查阅记录'],
            ['通讯设备畅通', '通讯设备24小时畅通，呼叫能及时响应', '现场检查'],
            ['信息通知与准备', '危重评估后第一时间通知抢救区，提前备好设备药品', '抽查+记录'],
            ['动态沟通', '主动与途中救护车沟通，动态调整准备方案', '查阅记录'],
            ['标准化交接', '使用交接核对单，双方签字，内容完整', '现场观察'],
            ['安全转运', '患者从担架到抢救床转运安全，无意外', '现场观察'],
            ['设备维护', '通讯设备、监护终端每日检查，状态良好', '现场+记录'],
            ['衔接流程制度', '院前院内衔接流程与制度完善，现行有效', '查阅文件'],
            ['质控检查', '每月≥1次交接病历质控，有记录', '查阅质控记录'],
            ['衔接时效监控', '各环节衔接时间节点有监控，延误有分析', '查阅记录'],
            ['不良事件RCA', '院前相关不良事件完成RCA分析，有报告', '查阅报告'],
            ['模拟演练', '每半年≥1次院前预警与院内接应演练', '查阅演练资料'],
            ['问题反馈', '组员发现问题及时反馈，有跟进', '查阅反馈记录']
          ]
        },
        {
          id: 'emergency', title: '急救应急小组查检表', items: [
            ['应急预案', '突发事件应急预案完善，为现行有效版本', '查阅文件'],
            ['预案知晓', '抽查2名组员知晓本人在预案中的角色分工', '现场提问'],
            ['演练计划', '有年度/季度演练计划并按计划执行', '查阅资料'],
            ['演练记录', '演练有签到、照片、过程记录', '查阅资料'],
            ['演练评估', '演练后有评估报告，含问题清单和改进建议', '查阅资料'],
            ['改进跟踪', '上次演练问题已整改落实，有跟踪记录', '对照核查'],
            ['急救设备', '抢救车、除颤仪、呼吸机等处于完好备用状态', '现场检查'],
            ['急救药品', '急救药品无过期，基数与清单一致', '现场清点'],
            ['应急响应', '紧急事件时小组成员5分钟内到位', '模拟抽查'],
            ['事件上报', '批量伤员等重大事件30分钟内上报护士长', '查阅记录']
          ]
        },
        {
          id: 'training', title: '技能培训小组查检表', items: [
            ['年度计划', '有年度护理技能培训与考核计划', '查阅文件'],
            ['分层培训', '针对N0-N4层级确定培训重点与目标', '查阅方案'],
            ['计划执行', '按计划完成培训，无延期超过2周', '对照核查'],
            ['培训记录', '每次培训有课件、签到、照片', '查阅资料'],
            ['核心技能覆盖', 'CPR、除颤、气道管理、创伤急救均纳入', '查阅内容'],
            ['新设备培训', '新设备投入使用前完成全员培训', '查阅记录'],
            ['考核覆盖率', '全科护士月度考核覆盖率100%', '查阅名单'],
            ['考核合格率', '合格率≥90%，不合格者有补考', '查阅成绩'],
            ['层级手册', '层级手册质控合格，培训记录完整', '查阅手册'],
            ['效果评估', '有培训效果评估，含改进建议', '查阅资料'],
            ['操作同质化', '同质化操作流程，抽查2人执行一致', '现场观察'],
            ['培训档案', '个人培训档案完整', '抽查3人']
          ]

        return {
          inspector: '', reviewer: '', checkDate: today, exportedAt: '',

        };

      function loadState() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
          state.activeId = forms.some(form => form.id === saved.activeId) ? saved.activeId : forms[0].id;
          state.forms = saved.forms && typeof saved.forms === 'object' ? saved.forms : {};
        } catch (error) {
          state.activeId = forms[0].id;
          state.forms = {};
        }
        forms.forEach(form => {
          const current = state.forms[form.id];
          if (!current || !Array.isArray(current.items) || current.items.length !== form.items.length) state.forms[form.id] = blankForm(form);
          else {
            current.inspector = current.inspector || '';
            current.reviewer = current.reviewer || '';
            current.checkDate = typeof current.checkDate === 'string' ? current.checkDate : today;
            current.exportedAt = current.exportedAt || '';
            current.items = form.items.map((_, index) => ({ result: current.items[index]?.result || '', remark: current.items[index]?.remark || '' }));
          }
        });
      }

        state.activeId = $('formSelect').value;

          localStorage.setItem(STORAGE_KEY, JSON.stringify({ activeId: state.activeId, forms: state.forms }));
          if (showMessage) showToast('已保存到本机');
        } catch (error) {
          showToast('本机存储不可用，请及时导出');
        }

        if (answered < data.items.length) return '填写中';
        return data.exportedAt ? '已导出' : '已完成';

      function bindDynamicFields() {
        document.querySelectorAll('input[type="radio"][data-index]').forEach(input => input.addEventListener('change', () => {

      function updateSummary() {
        const data = activeData();
        const total = data.items.length;
        const answered = data.items.filter(isAnswered).length;
        const passed = data.items.filter(item => item.result === '合格').length;
        const complete = total > 0 && answered === total;
        const rate = complete ? `${((passed / total) * 100).toFixed(1).replace(/\.0$/, '')}%` : '待完成';
        $('summaryBox').innerHTML = `<span>已填写 <strong>${answered}</strong> / ${total}</span><span>合格 <strong>${passed}</strong> 项</span><span>合格率 <strong>${rate}</strong></span>`;

        $('statusBadge').textContent = status;
        $('statusBadge').dataset.status = status;

      function validate() {
        const form = activeForm();
        const data = activeData();
        const errors = [];
        data.items.forEach((item, index) => { if (!isAnswered(item)) errors.push(`第${form.items[index].no}项“${form.items[index].checkItem}”未选择结果`); });
        renderErrors(errors);
        return errors.length === 0;

      function jumpToUnfinished() {
        const data = activeData();
        const index = data.items.findIndex(item => !isAnswered(item));

        let card = document.querySelector(`.item-card[data-index="${index}"]`);
        if (!card) {
          ui.showUnfinished = true;
          renderForm();
          setTimeout(jumpToUnfinished, 0);
          return;

        document.querySelectorAll('.item-card.is-highlighted').forEach(node => node.classList.remove('is-highlighted'));

        setTimeout(() => card.classList.remove('is-highlighted'), 1800);

      function buildPreviewHtml() {
        const model = getDocumentModel();
        const rows = model.rows.map(row => {
          return `<tr><td class="center">${row.no}</td><td>${escapeHtml(row.checkItem)}</td><td>${escapeHtml(row.standard)}</td><td>${escapeHtml(row.method)}</td><td class="center">${row.result === '合格' ? '✓' : ''}</td><td class="center">${row.result === '不合格' ? '✓' : ''}</td><td>${escapeHtml(row.remark || '')}</td></tr>`;
        }).join('');
        return `<h1 class="preview-title">${escapeHtml(model.title)}</h1>
          <table class="preview-table"><colgroup><col class="no"><col class="item"><col class="standard"><col class="method"><col class="result"><col class="result"><col class="remark"></colgroup>
          <thead><tr><th>序号</th><th>查检项目</th><th>查检标准</th><th>方法</th><th>合格</th><th>不合格</th><th>备注</th></tr></thead><tbody>${rows}</tbody></table>
          <div class="preview-meta"><span>查检人：${escapeHtml(model.inspector)}</span><span>查检日期：${escapeHtml(model.checkDate)}</span><span>护士长复核：${escapeHtml(model.reviewer)}</span></div>
          <div class="preview-rate">合格率=合格项目数/总检查项目数×100% = ${model.rateText}</div>`;

      function getDocumentModel() {
        const form = activeForm();
        const data = activeData();
        const rows = form.items.map((item, index) => ({
          no: item.no,
          checkItem: item.checkItem,
          standard: item.standard,
          method: item.method,
          result: data.items[index]?.result || '',
          remark: data.items[index]?.remark || ''
        }));
        const passed = rows.filter(row => row.result === '合格').length;
        const complete = rows.every(isAnswered);
        const rate = complete ? `${((passed / rows.length) * 100).toFixed(1).replace(/\.0$/, '')}%` : '待完成';
        return {
          title: form.title,
          rows,
          inspector: data.inspector || '',
          checkDate: data.checkDate || '',
          reviewer: data.reviewer || '',
          passed,
          complete,
          rateText: complete ? `${passed}/${rows.length}×100% = ${rate}` : '待完成'
        };
      }

      function canvasWrapText(context, value, maxWidth) {
        const text = String(value ?? '');
        const lines = [];
        text.split('\n').forEach(paragraph => {
          let line = '';
          for (const character of paragraph || ' ') {
            const next = line + character;
            if (line && context.measureText(next).width > maxWidth) {
              lines.push(line);
              line = character;
            } else {
              line = next;
            }
          }
          lines.push(line || '');
        });
        return lines;
      }

      function createPdfPages(model) {
        const pageWidth = 1240;
        const pageHeight = 1754;
        const margin = 56;
        const tableWidth = pageWidth - margin * 2;
        const widths = [56, 168, 385, 177, 76, 76, 202];
        const lineHeight = 25;
        const cellPadX = 7;
        const cellPadY = 8;
        const pages = [];
        let canvas;
        let context;
        let y;
        let firstPage;

        function newPage() {
          canvas = document.createElement('canvas');
          canvas.width = pageWidth;
          canvas.height = pageHeight;
          context = canvas.getContext('2d');
          context.fillStyle = '#ffffff';
          context.fillRect(0, 0, pageWidth, pageHeight);
          context.fillStyle = '#111111';
          context.textBaseline = 'top';
          context.font = 'bold 30px SimSun, Songti SC, serif';
          context.textAlign = 'center';
          context.fillText(model.title, pageWidth / 2, 42);
          context.textAlign = 'left';
          y = 102;
          firstPage = pages.length === 0;
          drawHeader();
        }

        function drawHeader() {
          const headers = ['序号', '查检项目', '查检标准', '方法', '合格', '不合格', '备注'];
          context.font = 'bold 17px SimSun, Songti SC, serif';
          let x = margin;
          context.fillStyle = '#f2f2f2';
          context.fillRect(x, y, tableWidth, 40);
          context.fillStyle = '#111111';
          headers.forEach((header, index) => {
            context.strokeStyle = '#111111';
            context.lineWidth = 1;
            context.strokeRect(x, y, widths[index], 40);
            context.textAlign = index === 0 || index === 4 || index === 5 ? 'center' : 'left';
            const lines = canvasWrapText(context, header, widths[index] - cellPadX * 2);
            context.fillText(lines[0] || '', index === 0 || index === 4 || index === 5 ? x + widths[index] / 2 : x + cellPadX, y + 10);
            x += widths[index];
          });
          context.textAlign = 'left';
          y += 40;
        }

        function drawRow(row) {
          context.font = '16px SimSun, Songti SC, serif';
          const values = [row.no, row.checkItem, row.standard, row.method, row.result === '合格' ? '✓' : '', row.result === '不合格' ? '✓' : '', row.remark || ''];
          const wrapped = values.map((value, index) => canvasWrapText(context, value, widths[index] - cellPadX * 2));
          const rowHeight = Math.max(42, Math.max(...wrapped.map(lines => lines.length)) * lineHeight + cellPadY * 2);
          if (y + rowHeight > pageHeight - margin - 120) {
            pages.push(canvas);
            newPage();
          }
          let x = margin;
          values.forEach((value, index) => {
            context.strokeStyle = '#111111';
            context.lineWidth = 1;
            context.strokeRect(x, y, widths[index], rowHeight);
            context.fillStyle = '#111111';
            context.textAlign = index === 0 || index === 4 || index === 5 ? 'center' : 'left';
            const lines = wrapped[index];
            lines.forEach((line, lineIndex) => {
              const textX = index === 0 || index === 4 || index === 5 ? x + widths[index] / 2 : x + cellPadX;
              context.fillText(line, textX, y + cellPadY + lineIndex * lineHeight);
            });
            x += widths[index];
          });
          context.textAlign = 'left';
          y += rowHeight;
        }

        newPage();
        model.rows.forEach(drawRow);
        const infoColumns = [
          `查检人：${model.inspector}`,
          `查检日期：${model.checkDate}`,
          `护士长复核：${model.reviewer}`
        ];
        context.font = '18px SimSun, Songti SC, serif';
        const infoLines = infoColumns.map((value, index) => canvasWrapText(context, value, tableWidth / 3 - 20));
        const infoHeight = Math.max(34, ...infoLines.map(lines => lines.length * 28 + 16)) + 42;
        if (y + infoHeight > pageHeight - margin) {
          pages.push(canvas);
          newPage();
        }
        context.fillStyle = '#111111';
        infoLines.forEach((lines, columnIndex) => {
          const columnWidth = tableWidth / 3;
          const centerX = margin + columnWidth * columnIndex + columnWidth / 2;
          context.textAlign = 'center';
          lines.forEach((line, lineIndex) => context.fillText(line, centerX, y + 8 + lineIndex * 28));
        });
        context.textAlign = 'left';
        context.fillText(`合格率=合格项目数/总检查项目数×100% = ${model.rateText}`, margin, y + Math.max(...infoLines.map(lines => lines.length)) * 28 + 18);
        pages.push(canvas);
        return pages;
      }

      function base64ToBytes(dataUrl) {
        const base64 = dataUrl.split(',')[1] || '';
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let index = 0; index < binary.length; index += 1) bytes[index] = binary.charCodeAt(index);
        return bytes;
      }

      function pdfObjectBytes(value) {
        return new TextEncoder().encode(value);
      }

      function buildImagePdf(pages) {
        const objects = [];
        const pageIds = pages.map((_, index) => 3 + index * 3);
        objects[1] = pdfObjectBytes('<< /Type /Catalog /Pages 2 0 R >>');
        objects[2] = pdfObjectBytes(`<< /Type /Pages /Kids [${pageIds.map(id => `${id} 0 R`).join(' ')}] /Count ${pages.length} >>`);
        pages.forEach((canvas, index) => {
          const pageId = 3 + index * 3;
          const contentId = pageId + 1;
          const imageId = pageId + 2;
          const jpeg = base64ToBytes(canvas.toDataURL('image/jpeg', 0.92));
          objects[pageId] = pdfObjectBytes(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 ${imageId} 0 R >> >> /Contents ${contentId} 0 R >>`);
          const content = 'q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';
          objects[contentId] = pdfObjectBytes(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
          objects[imageId] = { binary: jpeg, prefix: `<< /Type /XObject /Subtype /Image /Width ${canvas.width} /Height ${canvas.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpeg.length} >>\nstream\n`, suffix: '\nendstream' };
        });
        const parts = [pdfObjectBytes('%PDF-1.4\n%\xff\xff\xff\xff\n')];
        const offsets = [0];
        let total = parts[0].length;
        for (let id = 1; id < objects.length; id += 1) {
          const object = objects[id];
          const body = object.binary ? concatBytes([pdfObjectBytes(object.prefix), object.binary, pdfObjectBytes(object.suffix)]) : object;
          const header = pdfObjectBytes(`${id} 0 obj\n`);
          const footer = pdfObjectBytes('\nendobj\n');
          offsets[id] = total;
          parts.push(header, body, footer);
          total += header.length + body.length + footer.length;
        }
        const xrefOffset = total;
        let xref = `xref\n0 ${objects.length}\n0000000000 65535 f \n`;
        for (let id = 1; id < objects.length; id += 1) xref += `${String(offsets[id]).padStart(10, '0')} 00000 n \n`;
        xref += `trailer\n<< /Size ${objects.length} /Root 1 0 R >>\nstartxref\n${xrefOffset}\n%%EOF`;
        parts.push(pdfObjectBytes(xref));
        return new Blob([concatBytes(parts)], { type: 'application/pdf' });
      }

      function makePdfBlob() {
        return buildImagePdf(createPdfPages(getDocumentModel()));
      }

      function outputFile(blob, filename, options = {}) {
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = filename;
        link.rel = 'noopener';
        document.body.appendChild(link);
        link.click();
        link.remove();
        if (options.openInNewTab && /MicroMessenger/i.test(navigator.userAgent)) {
          const opened = window.open(url, '_blank', 'noopener');
          if (!opened) showToast('PDF 已生成，请点击右上角“在浏览器中打开”后分享');
        }
        setTimeout(() => URL.revokeObjectURL(url), 30000);
      }

      async function shareFile(blob, filename, title, fallbackMessage) {
        const file = new File([blob], filename, { type: blob.type });
        const canShare = typeof navigator.share === 'function' && (!navigator.canShare || navigator.canShare({ files: [file] }));
        if (canShare) {
          try {
            await navigator.share({ files: [file], title });
            markExported();
            showToast(`${title}已分享`);
            return true;
          } catch (error) {
            if (error && error.name === 'AbortError') {
              markExported();
              outputFile(blob, filename, { openInNewTab: blob.type === 'application/pdf' });
              showToast(`分享已取消，${title}已下载`);
              return false;
            }
          }
        }
        markExported();
        outputFile(blob, filename, { openInNewTab: blob.type === 'application/pdf' });
        showToast(fallbackMessage);
        return false;
      }

      async function exportPdf(share = false) {
        if (!$('previewModal').classList.contains('open') && !showPreview()) return;
        const blob = makePdfBlob();
        const filename = exportFilename('pdf');
        if (share) {
          await shareFile(blob, filename, 'PDF 文件', 'PDF 已下载；微信内置浏览器请在系统浏览器中打开后分享');
        } else {
          markExported();
          outputFile(blob, filename, { openInNewTab: true });
          showToast('PDF 文件已开始下载');
        }
      }

      function escapeXml(value) {
        return String(value ?? '').replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;' }[char]));
      }

      function wordRun(value, options = {}) {
        const text = String(value ?? '');
        const size = options.size || 18;
        const color = options.color ? `<w:color w:val="${options.color}"/>` : '';
        const bold = options.bold ? '<w:b/><w:bCs/>' : '';
        const runs = text.split('\n').map((part, index) => `${index ? '<w:br/>' : ''}<w:t xml:space="preserve">${escapeXml(part)}</w:t>`).join('');
        return `<w:r><w:rPr><w:rFonts w:ascii="SimSun" w:hAnsi="SimSun" w:eastAsia="宋体"/>${bold}${color}<w:sz w:val="${size}"/><w:szCs w:val="${size}"/></w:rPr>${runs || '<w:t xml:space="preserve"></w:t>'}</w:r>`;
      }

      function wordPara(content, align = 'left', options = {}) {
        const size = options.size || 18;
        const spacing = options.spacing || '80';
        const jc = align ? `<w:jc w:val="${align}"/>` : '';
        return `<w:p><w:pPr>${jc}<w:spacing w:after="${spacing}"/></w:pPr>${content || wordRun('', { size })}</w:p>`;
      }

      function wordCell(value, width, align = 'left', options = {}) {
        const shading = options.shading ? `<w:shd w:fill="${options.shading}"/>` : '';
        return `<w:tc><w:tcPr><w:tcW w:w="${width}" w:type="dxa"/>${shading}<w:vAlign w:val="center"/></w:tcPr>${wordPara(wordRun(value, { bold: !!options.bold, size: options.size || 16 }), align, { size: options.size || 16, spacing: '0' })}</w:tc>`;
      }

      function wordRow(values, widths, options = {}) {
        const header = options.header ? '<w:tblHeader w:val="true"/>' : '';
        const cells = values.map((value, index) => wordCell(value, widths[index], options.centerColumns?.includes(index) ? 'center' : 'left', { bold: !!options.header, size: options.header ? 17 : 16, shading: options.header ? 'F2F2F2' : '' })).join('');
        return `<w:tr><w:trPr>${header}<w:cantSplit/></w:trPr>${cells}</w:tr>`;
      }

      function wordTable(rows, widths, options = {}) {
        const total = widths.reduce((sum, width) => sum + width, 0);
        const borders = '<w:tblBorders><w:top w:val="single" w:sz="6" w:space="0" w:color="000000"/><w:left w:val="single" w:sz="6" w:space="0" w:color="000000"/><w:bottom w:val="single" w:sz="6" w:space="0" w:color="000000"/><w:right w:val="single" w:sz="6" w:space="0" w:color="000000"/><w:insideH w:val="single" w:sz="6" w:space="0" w:color="000000"/><w:insideV w:val="single" w:sz="6" w:space="0" w:color="000000"/></w:tblBorders>';
        const grid = widths.map(width => `<w:gridCol w:w="${width}"/>`).join('');
        return `<w:tbl><w:tblPr><w:tblW w:w="${total}" w:type="dxa"/>${borders}<w:tblLayout w:type="fixed"/></w:tblPr><w:tblGrid>${grid}</w:tblGrid>${rows.join('')}</w:tbl>`;
      }

      function wordInfoTable(values) {
        const widths = [3120, 3120, 3120];
        const cells = values.map((value, index) => `<w:tc><w:tcPr><w:tcW w:w="${widths[index]}" w:type="dxa"/><w:vAlign w:val="center"/><w:tcBorders><w:top w:val="nil"/><w:left w:val="nil"/><w:bottom w:val="nil"/><w:right w:val="nil"/></w:tcBorders></w:tcPr>${wordPara(wordRun(value, { size: 18 }), 'center', { spacing: '0' })}</w:tc>`).join('');
        return `<w:tbl><w:tblPr><w:tblW w:w="9360" w:type="dxa"/><w:tblLayout w:type="fixed"/><w:tblBorders><w:top w:val="nil"/><w:left w:val="nil"/><w:bottom w:val="nil"/><w:right w:val="nil"/><w:insideH w:val="nil"/><w:insideV w:val="nil"/></w:tblBorders></w:tblPr><w:tblGrid><w:gridCol w:w="3120"/><w:gridCol w:w="3120"/><w:gridCol w:w="3120"/></w:tblGrid><w:tr><w:trPr><w:cantSplit/></w:trPr>${cells}</w:tr></w:tbl>`;
      }

      function buildDocxFiles() {
        const model = getDocumentModel();
        const widths = [560, 1500, 3275, 1500, 655, 655, 1215];
        const rows = [wordRow(['序号', '查检项目', '查检标准', '方法', '合格', '不合格', '备注'], widths, { header: true, centerColumns: [0, 4, 5] })];
        model.rows.forEach(row => {
          rows.push(wordRow([row.no, row.checkItem, row.standard, row.method, row.result === '合格' ? '✓' : '', row.result === '不合格' ? '✓' : '', row.remark || ''], widths, { centerColumns: [0, 4, 5] }));
        });
        const body = [
          wordPara(wordRun(model.title, { bold: true, size: 28 }), 'center', { spacing: '160' }),
          wordTable(rows, widths),
          wordInfoTable([`查检人：${model.inspector}`, `查检日期：${model.checkDate}`, `护士长复核：${model.reviewer}`]),
          wordPara(wordRun(`合格率=合格项目数/总检查项目数×100% = ${model.rateText}`, { size: 18 }), 'left', { spacing: '80' }),
          `<w:sectPr><w:footerReference w:type="default" r:id="rId3"/><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="850" w:right="850" w:bottom="850" w:left="850" w:header="425" w:footer="425" w:gutter="0"/><w:cols w:space="720"/></w:sectPr>`
        ].join('');
        const documentXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><w:body>${body}</w:body></w:document>`;
        const stylesXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="SimSun" w:hAnsi="SimSun" w:eastAsia="宋体"/><w:lang w:eastAsia="zh-CN"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:line="300" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:rPr><w:rFonts w:ascii="SimSun" w:hAnsi="SimSun" w:eastAsia="宋体"/><w:sz w:val="18"/></w:rPr></w:style></w:styles>`;
        const settingsXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:settings xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:zoom w:val="100"/><w:defaultTabStop w:val="720"/></w:settings>`;
        const footerXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:ftr xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:p><w:pPr><w:jc w:val="center"/></w:pPr>${wordRun('第 ', { size: 16 })}<w:fldSimple w:instr="PAGE">${wordRun('1', { size: 16 })}</w:fldSimple>${wordRun(' 页 / 共 ', { size: 16 })}<w:fldSimple w:instr="NUMPAGES">${wordRun('1', { size: 16 })}</w:fldSimple>${wordRun(' 页', { size: 16 })}</w:p></w:ftr>`;
        const contentTypes = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/><Override PartName="/word/settings.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.settings+xml"/><Override PartName="/word/footer1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.footer+xml"/></Types>`;
        const packageRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`;
        const documentRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/settings" Target="settings.xml"/><Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/footer" Target="footer1.xml"/></Relationships>`;
        return [
          { name: '[Content_Types].xml', data: contentTypes },
          { name: '_rels/.rels', data: packageRels },
          { name: 'word/document.xml', data: documentXml },
          { name: 'word/styles.xml', data: stylesXml },
          { name: 'word/settings.xml', data: settingsXml },
          { name: 'word/footer1.xml', data: footerXml },
          { name: 'word/_rels/document.xml.rels', data: documentRels }
        ];
      }

      function crc32(bytes) {
        let crc = 0xffffffff;
        for (let index = 0; index < bytes.length; index += 1) {
          crc ^= bytes[index];
          for (let bit = 0; bit < 8; bit += 1) crc = (crc >>> 1) ^ (crc & 1 ? 0xedb88320 : 0);
        }
        return (crc ^ 0xffffffff) >>> 0;
      }

      function little16(value) { return new Uint8Array([value & 255, (value >>> 8) & 255]); }
      function little32(value) { return new Uint8Array([value & 255, (value >>> 8) & 255, (value >>> 16) & 255, (value >>> 24) & 255]); }
      function concatBytes(parts) {
        const total = parts.reduce((sum, part) => sum + part.length, 0);
        const output = new Uint8Array(total);
        let offset = 0;
        parts.forEach(part => { output.set(part, offset); offset += part.length; });
        return output;
      }

      function zipStored(files) {
        const encoder = new TextEncoder();
        const localParts = [];
        const centralParts = [];
        let offset = 0;
        files.forEach(file => {
          const name = encoder.encode(file.name);
          const data = encoder.encode(file.data);
          const crc = crc32(data);
          const local = concatBytes([little32(0x04034b50), little16(20), little16(0x0800), little16(0), little16(0), little16(0), little32(crc), little32(data.length), little32(data.length), little16(name.length), little16(0), name, data]);
          localParts.push(local);
          const central = concatBytes([little32(0x02014b50), little16(20), little16(20), little16(0x0800), little16(0), little16(0), little16(0), little32(crc), little32(data.length), little32(data.length), little16(name.length), little16(0), little16(0), little16(0), little16(0), little32(0), little32(offset), name]);
          centralParts.push(central);
          offset += local.length;
        });
        const central = concatBytes(centralParts);
        const locals = concatBytes(localParts);
        const end = concatBytes([little32(0x06054b50), little16(0), little16(0), little16(files.length), little16(files.length), little32(central.length), little32(locals.length), little16(0)]);
        return concatBytes([locals, central, end]);
      }

      function makeDocxBlob() {
        return new Blob([zipStored(buildDocxFiles())], { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
      }

      function exportFilename(extension) {
        const form = activeForm();
        const data = activeData();
        return `${form.title}_${data.checkDate || today}.${extension}`;
      }

      function markExported() {
        activeData().exportedAt = new Date().toISOString();
        saveState();
        updateSummary();
      }

      function triggerDownload(blob, filename) {
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1500);
      }

      function downloadDocx() {
        if (!$('previewModal').classList.contains('open') && !showPreview()) return;
        const blob = makeDocxBlob();
        markExported();
        triggerDownload(blob, exportFilename('docx'));
        showToast('Word 文档已开始下载');
      }

      async function shareWord() {
        if (!$('previewModal').classList.contains('open') && !showPreview()) return;
        const blob = makeDocxBlob();
        const filename = exportFilename('docx');
        const file = new File([blob], filename, { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
        const canShareFiles = typeof navigator.share === 'function' && (!navigator.canShare || navigator.canShare({ files: [file] }));
        if (canShareFiles) {
          try {
            await navigator.share({ files: [file], title: activeForm().title, text: '急救小组查检表' });
            markExported();
            showToast('Word 文档已分享');
            return;
          } catch (error) {
            if (error && error.name === 'AbortError') {
              markExported();
              triggerDownload(blob, filename);
              showToast('分享已取消，已下载 Word');
              return;
            }
          }
        }
        markExported();
        triggerDownload(blob, filename);
        showToast('当前环境不支持直接分享，已下载 Word；请在系统浏览器中打开后分享');
      }

      function clearCurrent() {
        if (!window.confirm(`确定清空“${activeForm().title}”的全部填写内容吗？`)) return;
        state.forms[state.activeId] = blankForm(activeForm());
        saveState(); renderForm(); showToast('当前表单已清空');
      }

      function showToast(message) {
        const node = $('toast'); node.textContent = message; node.classList.add('show');
        clearTimeout(toastTimer); toastTimer = setTimeout(() => node.classList.remove('show'), 2400);
      }
      function escapeHtml(value) { return String(value ?? '').replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char])); }
      function escapeAttr(value) { return escapeHtml(value); }

      loadState(); renderSelect(); renderForm(); bindBasicFields(); updateMobileHint();
      $('saveBtn').addEventListener('click', () => saveState(true));
      $('previewBtn').addEventListener('click', showPreview);
      $('pdfBtn').addEventListener('click', () => exportPdf(false));
      $('sharePdfBtn').addEventListener('click', () => exportPdf(true));
      $('wordBtn').addEventListener('click', downloadDocx);
      $('shareWordBtn').addEventListener('click', shareWord);
      $('clearBtn').addEventListener('click', clearCurrent);
      $('closePreviewBtn').addEventListener('click', closePreview);
      $('backEditBtn').addEventListener('click', closePreview);
      $('previewPdfBtn').addEventListener('click', () => exportPdf(false));
      $('previewWordBtn').addEventListener('click', downloadDocx);
      $('previewModal').addEventListener('click', event => { if (event.target === $('previewModal')) closePreview(); });
      document.addEventListener('keydown', event => { if (event.key === 'Escape' && $('previewModal').classList.contains('open')) closePreview(); });
      window.addEventListener('afterprint', () => showToast('已打开打印窗口，可选择“存储为 PDF”')); 
    })();
  </script>
</body>
</html>
